<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alyssa Sparks - Fashion & Lifestyle Creator</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FDF8F5;
            --text-color: #2C2C2C;
            --button-bg: #FFFFFF;
            --button-hover: #F8E5E5;
            --accent-color: #FFB6C1;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .container {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }

        .button {
            background: var(--button-bg);
            color: var(--text-color);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .button:hover {
            background: var(--button-hover);
            transform: translateY(-2px);
        }

        .social-links a {
            color: var(--text-color);
            opacity: 0.8;
        }

        .social-links a:hover {
            opacity: 1;
        }

        .location {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-color);
            opacity: 0.8;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=300&h=300&fit=crop" alt="Alyssa Sparks" class="profile-img">
        
        <header class="header">
            <h1>👋 Hi, I'm Alyssa Sparks</h1>
            <p>Fashion & Lifestyle Creator</p>
        </header>

        <div class="bio">
            <p>Sharing everyday style, skincare routines & real-life moments ✨</p>
            <div class="location">
                📍 NYC | 💌 DM for collaborations
            </div>
        </div>

        <div class="button-list">
            <a href="#" class="button">
                🎥 <span>Watch My Latest Vlog</span>
            </a>
            <a href="#" class="button">
                🛍 <span>Shop My Looks</span>
            </a>
            <a href="#" class="button">
                📸 <span>Instagram</span>
            </a>
            <a href="#" class="button">
                💌 <span>Contact Me</span>
            </a>
        </div>

        <div class="social-links">
            <a href="#" title="TikTok">📱</a>
            <a href="#" title="YouTube">🎥</a>
            <a href="#" title="Instagram">📸</a>
            <a href="#" title="Email">💌</a>
        </div>
    </div>
</body>
</html>
