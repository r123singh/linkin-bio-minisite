<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ravi Patel - Frontend Dev & UI Designer</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0F172A;
            --card-bg: #1E293B;
            --text-color: #E2E8F0;
            --accent-color: #38BDF8;
            --button-bg: #334155;
            --button-hover: #475569;
            --code-font: 'Fira Code', monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .container {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-family: var(--code-font);
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-color);
            opacity: 0.8;
        }

        .bio {
            font-family: var(--code-font);
            font-size: 1rem;
        }

        .tech-stack {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
            font-family: var(--code-font);
            color: var(--accent-color);
            opacity: 0.8;
        }

        .button {
            background: var(--button-bg);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: var(--code-font);
        }

        .button:hover {
            background: var(--button-hover);
            transform: translateY(-2px);
        }

        .social-links a {
            color: var(--text-color);
            opacity: 0.8;
            font-family: var(--code-font);
        }

        .social-links a:hover {
            color: var(--accent-color);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300&h=300&fit=crop" alt="Ravi Patel" class="profile-img">
        
        <header class="header">
            <h1>👋 Hi, I'm Ravi Patel</h1>
            <p>Frontend Dev & UI Designer</p>
        </header>

        <div class="bio">
            <p>I help startups build clean, fast, and user-friendly websites.</p>
            <div class="tech-stack">
                <span>React</span>
                <span>Next.js</span>
                <span>Tailwind CSS</span>
            </div>
        </div>

        <div class="button-list">
            <a href="#" class="button">
                💼 <span>View My Portfolio</span>
            </a>
            <a href="#" class="button">
                💬 <span>Book a Free Call</span>
            </a>
            <a href="#" class="button">
                📩 <span>Email Me</span>
            </a>
            <a href="#" class="button">
                📝 <span>Download My Resume</span>
            </a>
        </div>

        <div class="social-links">
            <a href="#" title="GitHub">{ }</a>
            <a href="#" title="LinkedIn">in</a>
            <a href="#" title="Twitter">𝕏</a>
            <a href="#" title="Behance">Be</a>
        </div>
    </div>
</body>
</html>
